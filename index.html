<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>好评统计</title>
<!-- 字体全部用 macOS 自带（Didot / 宋体 / Optima），不再外链 Google Fonts -->
<style>
  /* ═══════════════════════════════════════════════════════════════
     赫眉 HYMN · 好评统计 — 版式照《设计稿-看板》重做（2026-09-21）

     那张稿的规矩，这里一条不改地照搬：
       1. 没有卡片、没有圆角、没有阴影、没有填充色块。
          分区只靠三样：**留白、0.5px 发丝线、字号反差**。
       2. 骨白纸 #FDFCFA 打底 —— 纯白在大面积上会发冷发廉价。
       3. 极端的字号层级：标签 10px / 正文 13px / 主数字 60px。
       4. 品牌粉只出现在几个关键位置（logo 下那条线、主数字、差评），
          **面积极小但位置关键** —— 奢侈品是靠位置用色，不是靠面积。
       5. 字体用 macOS 自带：数字走 Didot，中文标题走宋体，
          正文和小标签走 Optima / 苹方。

     导出的图（assets/image-export.js）用的是同一套常量，
     所以页面上看到的和下载下来的图长得一样。
     ═══════════════════════════════════════════════════════════════ */
  :root{
    --paper:#FDFCFA;        /* 骨白，不是纯白 */
    --ink:#16140F;
    --ink-soft:#4A453C;
    --dim:#9C958A;
    --hair:#E3DFD6;
    --hair-2:#F0EDE6;
    --pink:#A56B79;         /* 品牌粉：数字、logo、点缀线都用它 */
    --pink-deep:#A56B79;
    --serif:Didot,"Bodoni 72","Songti SC",Georgia,serif;
    --song:"Songti SC","STSong",Didot,serif;
    --sans:"Optima","PingFang SC",-apple-system,system-ui,sans-serif;
    /* 老变量留着，个别地方还在引用 */
    --muted:var(--dim); --line:var(--hair); --bad:var(--pink-deep);
  }
  *{box-sizing:border-box}
  ::selection{background:rgba(217,166,174,.30)}
  body{
    margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
    font-family:var(--sans);-webkit-font-smoothing:antialiased;
    padding:0 0 40px;
  }
  /* 满屏铺开 + 固定一屏：不限制最大宽度，两边只留一点呼吸的边距。
     宽屏下拆成左右两栏 —— 左边上传和口径，右边统计结果，
     **整页不滚动**，要滚只在各自那一栏里滚。
     （报表有四十多行，不可能真的全塞进一屏，所以是"版面固定、内容在栏内滚"。）
     窄屏退回普通的上下排版，一屏固定在手机上没法用。 */
  .layout{width:100%;max-width:none;margin:0;padding:0 48px;position:relative}
  .pane{display:contents}

  /* ── 页眉：居中 logo + 一行极小英文 + 一段 34px 的品牌粉 ── */
  /* logo 和文字并排一行 —— 竖着堆三层太占高度，那点高度该留给数据 */
  .brand{display:flex;align-items:center;justify-content:center;padding:26px 0 0;margin:0}
  /* logo 拿 PNG 的 alpha 当遮罩、颜色由 CSS 上：
     这样 logo 和页面上的数字永远是同一个粉，改一个值两边一起变 */
  /* 先摆原图（原色是深酒红），加载完由脚本用 canvas 重新上成品牌粉。
     不用 CSS mask —— 它在有的环境里会整块渲染不出来，logo 直接消失。 */
  .brand-logo{height:30px;width:124px;display:inline-block;
    background:url(assets/logo-hymn.png) no-repeat center/contain}
  .brand-title{margin:0 0 0 18px;padding-left:18px;border-left:1px solid var(--hair);
    font-family:var(--sans);font-weight:500;font-size:12px;letter-spacing:.3em;
    color:var(--ink);text-transform:uppercase}
  .brand-rule{display:none}

  /* ── 分区：没有卡片，只有一条发丝线和大片留白 ── */
  .card{
    background:none;border:0;border-radius:0;box-shadow:none;position:relative;
    border-top:.5px solid var(--hair);padding:62px 0 0;margin:0 0 6px;
  }
  .card:first-of-type{border-top:0;padding-top:70px}
  .card h2{margin:0;font-family:var(--song);font-size:30px;font-weight:400;letter-spacing:.05em}
  .card .lead{margin:16px 0 0;color:var(--ink-soft);font-size:15px;letter-spacing:.02em;line-height:1.9}
  .card h2+.lead{margin-bottom:0}
  /* 步骤号：一个 Didot 数字，不是彩色圆点 */
  .step{font-family:var(--serif);font-size:17px;color:var(--ink);margin-right:16px;
    letter-spacing:0;vertical-align:.1em}
  .step::after{content:'';display:inline-block;width:22px;height:.5px;background:var(--hair);
    vertical-align:.28em;margin-left:16px}

  /* ── 两条上传通道 ── */
  .lanes{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:44px}
  .lanes .lane{padding:0 46px;border-left:.5px solid var(--hair)}
  .lanes .lane:first-child{border-left:0;padding-left:0}
  .lane .tag{display:block;font-size:12px;font-weight:500;letter-spacing:.22em;
    text-transform:uppercase;color:var(--ink);margin-bottom:14px}
  /* 上传框：实线边框 + 大字，这是页面上第一个要被点的东西 */
  .drop{
    border:1px solid var(--ink);border-radius:0;background:none;
    padding:34px 22px;text-align:center;cursor:pointer;transition:background .25s,color .25s;
  }
  .drop:hover,.drop.over{background:var(--ink);color:var(--paper)}
  .drop:hover .small,.drop.over .small{color:var(--paper)}
  .drop .big{font-family:var(--song);font-size:20px;font-weight:400;letter-spacing:.06em}
  .drop .small{margin-top:10px;font-size:13px;color:var(--ink-soft);letter-spacing:.06em}
  .lane .path{margin-top:16px;font-size:13px;color:var(--ink-soft);line-height:1.9}
  input[type=file]{display:none}
  .files{margin-top:16px;display:flex;flex-wrap:wrap;gap:0;flex-direction:column}
  .chip{display:flex;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--hair);
    border-radius:0;padding:12px 0;background:none;font-size:14px;color:var(--ink)}
  .chip b{font-weight:400;color:var(--ink)}
  .chip .n{color:var(--ink-soft);margin-left:auto;font-family:var(--serif);font-size:15px}
  .chip .x{cursor:pointer;color:var(--dim);font-size:15px;line-height:1}
  .chip .x:hover{color:var(--pink-deep)}
  .chip .dl{cursor:pointer;color:var(--dim);font-size:13px;line-height:1}
  .chip .dl:hover{color:var(--ink)}
  .dlall{align-self:flex-start;margin-top:12px;background:none;border:none;padding:0 0 2px;font-family:inherit;
    font-size:13px;letter-spacing:.12em;color:var(--ink);cursor:pointer;
    border-bottom:1px solid var(--ink)}
  .dlall:hover{color:var(--ink);border-bottom-color:var(--ink)}

  /* ── 设置：下划线式表单，没有圆角方框 ── */
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:40px;
    align-items:start;margin-top:44px}
  label.fl{display:block;margin:0 0 10px;font-size:12px;color:var(--ink);
    letter-spacing:.2em;text-transform:uppercase;font-weight:500}
  /* 控件一律给实框 —— 只留一条下划线的话，根本看不出哪里能点 */
  select,input[type=date],input[type=text]{
    width:100%;min-height:52px;border:1px solid var(--hair);border-radius:0;
    padding:13px 16px;font-size:15px;outline:none;background:none;color:var(--ink);
    font-family:inherit;transition:border-color .22s;-webkit-appearance:none;appearance:none;
  }
  input[type=date]:hover,input[type=text]:hover{border-color:var(--ink-soft)}
  input[type=date]:focus,input[type=text]:focus{border-color:var(--ink)}

  /* 自绘下拉：原生 select 的弹层是系统画的，样式够不着，所以套一层自己的。
     原 select 藏在里面继续当数据源，见 assets/select.js */
  .sel{position:relative}
  .sel>select{display:none}
  .sel-btn{width:100%;min-height:52px;border:1px solid var(--hair);background:none;
    font-family:inherit;font-size:15px;color:var(--ink);text-align:left;padding:13px 40px 13px 16px;
    cursor:pointer;transition:border-color .22s}
  .sel-btn:hover{border-color:var(--ink-soft)}
  .sel::after{content:'';position:absolute;right:17px;top:22px;width:7px;height:7px;pointer-events:none;
    border-right:1.4px solid var(--ink);border-bottom:1.4px solid var(--ink);
    transform:rotate(45deg);transition:transform .22s}
  .sel.open .sel-btn{border-color:var(--ink)}
  .sel.open::after{transform:rotate(-135deg);top:25px}
  /* fixed 定位，位置由 select.js 按按钮算 —— 挂在工具栏里时，
     任何祖先的 overflow 都裁不到它 */
  .sel-panel{position:fixed;z-index:300;min-width:200px;
    background:var(--paper);border:1px solid var(--ink);padding:6px 0;
    box-shadow:0 10px 30px -12px rgba(22,20,15,.25)}
  .sel-opt{padding:13px 16px;font-size:15px;color:var(--ink-soft);cursor:pointer;
    display:flex;align-items:center;gap:12px;white-space:nowrap}
  .sel-opt:hover{color:var(--ink)}
  .sel-opt.on{color:var(--ink)}
  .sel-opt:hover{background:var(--hair-2)}
  .sel-opt .tick{width:10px;height:10px;border:1px solid var(--hair);flex:none;display:block}
  .sel-opt.on .tick{background:var(--pink-deep);border-color:var(--pink-deep)}
  .hint{margin-top:12px;font-size:13px;color:var(--ink-soft);line-height:1.8}
  /* 日期区间：开始 — 结束 两个框 */
  .opts .wide{grid-column:span 2}   /* 日期区间要放下两个日期框，占两格 */
  .range{display:flex;align-items:baseline;gap:12px}
  .range input[type=date]{flex:1;min-width:0}
  .range{align-items:center}
  .range-sep{color:var(--ink);font-size:14px;flex:none}

  /* 「这位经理名下没有数据」这类空态提示还在用 */
  .msel-empty{padding:16px 0;font-size:12px;color:var(--dim);text-align:center}

  /* ── 区域经理 ── */
  .row{display:flex;gap:18px;align-items:center}
  .row .sel{flex:1;min-width:0}
  .mask{position:fixed;inset:0;z-index:200;background:rgba(22,20,15,.32);
    display:flex;align-items:center;justify-content:center;padding:24px}
  .modal{
    width:min(720px,100%);max-height:86vh;overflow:auto;background:var(--paper);
    border:.5px solid var(--hair);border-radius:0;padding:46px 46px 38px;box-shadow:none;
  }
  .modal h3{margin:0;font-family:var(--song);font-size:22px;font-weight:400;letter-spacing:.05em}
  .modal .lead{margin:14px 0 26px;color:var(--ink-soft);font-size:12.5px;line-height:2}
  .mgr-chips{display:flex;flex-wrap:wrap;gap:0 26px;margin-bottom:26px}
  .mgr-chip{border:0;border-bottom:.5px solid transparent;border-radius:0;padding:7px 0;background:none;
    font-size:13.5px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:8px;color:var(--dim)}
  .mgr-chip:hover{color:var(--ink)}
  .mgr-chip.on{color:var(--ink);border-bottom-color:var(--pink)}
  .mgr-chip .cnt{font-family:var(--serif);font-size:12px;color:var(--dim)}
  .mgr-chip.add{color:var(--dim)}
  .mgr-name{margin-bottom:22px}
  .store-tools{display:flex;gap:20px;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap}
  .store-tools input[type=text]{flex:1;min-width:140px}
  .store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0;
    max-height:300px;overflow:auto;border:0;border-top:.5px solid var(--hair);
    border-bottom:.5px solid var(--hair);border-radius:0;padding:6px 0;background:none}
  .store-item{display:flex;align-items:center;gap:9px;padding:8px 0;border-radius:0;
    font-size:13px;cursor:pointer;color:var(--dim)}
  .store-item:hover{color:var(--ink)}
  .store-item.on{color:var(--ink)}
  .store-item .tick{width:9px;height:9px;border-radius:0;border:.5px solid var(--hair);flex:none}
  .store-item.on .tick{background:var(--pink);border-color:var(--pink)}
  .modal-actions{display:flex;gap:28px;margin-top:30px;flex-wrap:wrap;align-items:center}
  .modal-actions .spacer{flex:1}

  /* ── 按钮 ──
     整页只有「开始统计」是主操作，所以只有它是实心色块；
     其余（导出 Excel / 下载图片 / 管理…）一律是拉开字距的小字压一条线。
     这是全页唯一一块填充色，靠的就是"只此一处"来抓眼睛。 */
  .btn{
    min-height:auto;padding:22px 64px;border:0;border-radius:0;box-shadow:none;
    background:var(--pink-deep);color:var(--paper);font-family:inherit;
    font-size:16px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;
    cursor:pointer;transition:background .25s;
  }
  .btn:hover{background:var(--ink)}
  .btn:active{opacity:.86}
  .btn[disabled]{background:var(--hair-2);color:var(--dim);cursor:not-allowed}
  .btn.ghost{
    padding:13px 0 11px;background:none;color:var(--ink);font-size:13px;letter-spacing:.2em;
    border-bottom:1px solid var(--ink);
  }
  .btn.ghost:hover{background:none;color:var(--ink);border-bottom-color:var(--ink)}
  .btn.mini{padding:9px 0 7px;font-size:11px;letter-spacing:.18em}
  .actions{display:flex;gap:44px;flex-wrap:wrap;margin-top:46px;align-items:center}

  /* ── 统计结果 ── */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;
    margin:36px 0 0;padding:34px 0;
    border-top:.5px solid var(--hair);border-bottom:.5px solid var(--hair)}
  .kpi{border:0;border-radius:0;background:none;padding:0 34px;border-left:.5px solid var(--hair);
    text-align:center}   /* 数字和下面那行小字居中对齐，和导出图一致 */
  .kpi:first-child{border-left:0}
  .kpi .k{font-size:13px;font-weight:500;letter-spacing:.2em;color:var(--ink-soft);text-transform:none}
  /* 三个数字共用一条底线 —— 大小不一也不会看着高低不齐 */
  .kpi .v{margin-top:16px;height:64px;display:flex;align-items:flex-end;justify-content:center;
    line-height:1;font-family:var(--serif);font-weight:400;font-size:40px;letter-spacing:0;color:var(--ink)}
  .kpi .v.sm{font-size:30px}
  .kpi.hero .v{font-size:60px;color:var(--pink-deep)}   /* 中间那个主角 */
  .kpi .v.up{color:var(--pink-deep)}
  .kpi .s{margin-top:14px;font-size:14px;color:var(--ink-soft)}

  /* ── 页签 + 表格 ── */
  .tabs{display:flex;gap:40px;margin-top:22px;border-bottom:1px solid var(--hair)}
  .tab{padding:0 0 11px;font-size:15px;font-weight:500;letter-spacing:.12em;color:var(--dim);
    cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .2s}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--ink);border-bottom-color:var(--ink)}
  .tablewrap{max-height:none;overflow:visible;border-radius:0;margin-top:30px}
  table{width:100%;border-collapse:collapse;white-space:nowrap;background:none}
  thead th{background:none;color:var(--ink-soft);font-weight:500;font-size:13px;
    padding:0 14px 16px;text-align:right;letter-spacing:.06em;border-bottom:1px solid var(--hair)}
  thead th:first-child{text-align:left;padding-left:0}
  tbody td{padding:17px 14px;text-align:right;color:var(--ink);
    font-family:var(--serif);font-size:17px;border-bottom:.5px solid var(--hair-2)}
  tbody td:first-child{text-align:left;padding-left:0;font-family:var(--song);font-size:17px;
    font-weight:400;letter-spacing:.04em;color:var(--ink)}
  tbody tr:last-child td{border-bottom:.5px solid var(--hair)}
  td.up{color:var(--ink)}
  td.zero{color:var(--dim)}
  td.bad{color:var(--pink-deep)}
  td .no{color:var(--dim);margin-right:12px;font-family:var(--serif)}
  tbody td.mix{font-family:var(--sans);font-size:13px;letter-spacing:.02em}
  tbody td.mgr{font-family:var(--sans);font-size:14px;color:var(--ink-soft)}
  /* 「门店好评差评」页签显示的是导出图的预览（所见即所得），
     这时 KPI 和表格退居幕后只当数据源；
     「日期对比」「门店名称对照」是拿来查的，还是给真表格 —— 文字能选能复制。 */
  #coverage{display:none}
  #resultCard.shot #kpis,#resultCard.shot .tablewrap{display:none}
  #resultCard:not(.shot) #preview{display:none}
  /* 数据异常提醒：看得见就行，不跟结果抢头条 */
  .warn{margin-top:16px;border-left:2px solid var(--pink-deep);padding:7px 0 7px 12px;
    font-size:12px;line-height:1.65;color:var(--ink-soft)}
  .warn div+div{margin-top:7px}
  .warn b{font-weight:500;color:var(--pink-deep)}
  .res-top{display:flex;align-items:baseline;justify-content:space-between;gap:30px}
  .res-top h2 .lead{margin:0 0 0 18px;font-size:14px;font-family:var(--sans)}
  .res-acts{display:flex;gap:30px;flex-wrap:wrap}
  #preview{margin-top:32px}
  /* 预览缩到 480 —— 一屏能看到十几行而不是五行。
     原生 1286px，缩到这个宽度是大幅降采样，字反而更锐。 */
  #preview{margin-top:12px}
  #preview img{display:block;width:100%;max-width:440px;height:auto;margin:0 auto;cursor:zoom-in}
  /* 点预览放大看：盖一层，图按画布原始像素铺开（1 画布像素 = 1 CSS 像素，最清楚），
     上下可滚，点任意处或按 Esc 关掉 */
  .zoom{position:fixed;inset:0;z-index:300;background:rgba(22,20,15,.6);
    overflow:auto;padding:28px;cursor:zoom-out;-webkit-overflow-scrolling:touch}
  .zoom img{display:block;margin:0 auto;height:auto;background:var(--paper);
    width:min(1286px,calc(100vw - 56px))}

  /* ── 零碎 ── */
  .filemeta{margin-top:18px;font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .filemeta b{color:var(--ink-soft);font-weight:400}
  .linkbtn{background:none;border:0;border-bottom:1px solid var(--hair);padding:0 0 2px;
    font-family:inherit;font-size:13px;letter-spacing:.1em;color:var(--ink-soft);cursor:pointer}
  .linkbtn:hover{color:var(--ink);border-bottom-color:var(--ink)}
  .err{margin-top:14px;color:var(--pink-deep);font-size:14px;min-height:18px;line-height:1.8}
  .hidden{display:none !important}

  footer,.footnote{margin-top:78px;padding:40px 0 0;text-align:center;color:var(--dim);
    font-size:11px;letter-spacing:.3em;text-transform:uppercase;font-weight:400;
    border-top:1px solid var(--hair)}

  #toast{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:9999;
    background:var(--ink);color:var(--paper);padding:14px 28px;border-radius:0;
    font-size:14px;letter-spacing:.1em;box-shadow:none;display:none}

  @media (min-width:1280px) and (min-height:620px){
    html,body{height:100%;overflow:hidden}
    /* 版面权重：真正的产出是右边那张能直接发出去的图。
       上传是一次性动作、口径九成用默认值、开始统计只是中间步骤 ——
       这三样合起来压进左边一条 340px 的窄栏，剩下全部给结果。 */
    .layout{height:100vh;display:grid;
      grid-template-columns:340px minmax(0,1fr);
      grid-template-rows:auto auto minmax(0,1fr);
      gap:0 64px;padding:0 44px 22px;align-items:stretch}
    .brand{grid-column:1/-1;grid-row:1;padding:16px 0 12px}
    .brand-logo{height:23px;width:96px}
    .brand-title{font-size:11px;margin-left:16px;padding-left:16px}
    .footnote{display:none}   /* 装饰行，占着一整行把内容挤到要滚 */
    /* 统计口径横排在最上面一条：四个设置 + 开始统计 一行摆开，
       下面整块横向让给上传和结果 */
    .pane-b{grid-column:1/-1;grid-row:2;overflow:visible}
    .pane-a{grid-column:1;grid-row:3}
    .pane-r{grid-column:2;grid-row:3}
    .footnote{grid-column:1/-1}

    /* 左栏全部压扁 —— 它只是通往结果的路，不该占视觉重量 */
    .pane-a{overflow:hidden}
    .pane-a .card{padding-top:22px;border-top:0;display:flex;flex-direction:column;height:100%}
    .pane-a .warn{margin-top:auto}   /* 提醒沉到左下角 */
    .pane-a .lanes{grid-template-columns:1fr;gap:18px;margin-top:0}
    .pane-a .lanes .lane{border-left:0;padding:0}
    .pane-a .lane .tag{font-size:11px;margin-bottom:8px}
    /* 上传框压成一行细条：它只是入口，点一次就完事，不该比主操作还占地方 */
    .pane-a .drop{padding:11px 14px;display:flex;align-items:baseline;justify-content:center;gap:10px}
    .pane-a .drop .big{font-size:14px}
    .pane-a .drop .small{margin-top:0;font-size:11.5px;color:var(--dim)}
    .pane-a .lanes{gap:14px}
    .pane-a .lane .tag{font-size:10.5px;margin-bottom:6px}
    /* 导出路径是第一次用才看的说明，收进上传框的悬停提示，不长期占位 */
    .pane-a .lane .path{display:none}
    .pane-a .chip{padding:8px 0;font-size:13px}
    .pane-a .filemeta{margin-top:10px;font-size:12.5px}
    .pane-b .card{display:flex;align-items:flex-end;gap:32px;padding:0 0 20px;
      border-top:0;border-bottom:1px solid var(--hair)}
    .pane-b .opts{flex:1;grid-template-columns:repeat(4,1fr);gap:24px;margin:0}
    .pane-b .opts .wide{grid-column:span 1;position:relative}
    .pane-b label.fl{font-size:11px;margin-bottom:5px}
    .pane-b select,.pane-b input[type=date],.pane-b .sel-btn{min-height:42px;padding:10px 14px;font-size:14px}
    .pane-b .sel::after{top:17px}
    .pane-b .sel.open::after{top:20px}
    /* 「数据覆盖 …」绝对定位挂在下面，不把这一条工具栏撑高 */
    .pane-b .hint{position:absolute;top:100%;left:0;margin-top:5px;font-size:11.5px;line-height:1.4}
    .pane-b .actions{margin:0}
    #runBtn{width:auto;padding:13px 44px;font-size:14px;letter-spacing:.26em}
    /* 结果区的标题 / 按钮 / 页签冻结在栏顶，报表在底下滚 */
    .pane-r .card{padding-top:0}
    .res-head{position:sticky;top:0;z-index:5;background:var(--paper);padding:20px 0 0}
    .res-head::after{content:'';display:block;height:14px;
      background:linear-gradient(var(--paper),rgba(253,252,250,0))}
    .brand{grid-column:1/-1;padding:30px 0 0}
    .pane{display:block;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:14px}
    .pane .card:first-of-type{border-top:0;padding-top:34px}
    .pane .card{padding-top:48px}
    .footnote{grid-column:1/-1;margin-top:0;padding:14px 0 0}
    /* 一屏之内，纵向间距整体收紧 —— 主操作「开始统计」必须在首屏看得见 */
    .card h2{font-size:23px}
    .card .lead{margin-top:12px;font-size:14px}
    .lane .path{margin-top:12px;font-size:12.5px;line-height:1.8}
    /* 滚动条收细，别打断这张纸 */
    .pane::-webkit-scrollbar{width:4px}
    .pane::-webkit-scrollbar-thumb{background:var(--hair)}
    .pane::-webkit-scrollbar-track{background:none}
  }

  @media (max-width:760px){
    .card{padding-top:46px}
    .card:first-of-type{padding-top:48px}
    .lanes{grid-template-columns:1fr;gap:40px}
    .lanes .lane{border-left:0;padding:0}
    .layout{padding:0 26px}
    .opts{grid-template-columns:1fr;gap:30px}   /* 日期框有固定最小宽度，不强制单列会横向撑破 */
    .range input[type=date]{width:100%;min-width:0}
    .kpi{padding:0 18px}
    .tabs{gap:26px}
    tbody td,thead th{padding-left:8px;padding-right:8px}
  }
</style>
</head>
<body>
<main class="layout">

  <div class="brand">
    <span class="brand-logo" role="img" aria-label="赫眉 HYMN"></span>
    <h1 class="brand-title">Review Statistics</h1>
    <div class="brand-rule"></div>

  <!-- 三栏并排：上传 | 口径 | 结果。整页不滚，每栏装得下自己的内容 -->
  <div class="pane pane-a">
  <!-- ① 上传 -->
  <section class="card">

    <div class="lanes">
      <div class="lane">
        <span class="tag">美团 / 大众点评</span>
        <div class="drop" data-pf="meituan"
             title="导出路径：评价管理 → 门店评价 → 平台选美团 → 选日期 → 下载评论">
          <div class="big">美团评价表</div>
          <div class="small">可一次选多份</div>
        </div>
        <div class="path">导出路径：评价管理 → 门店评价 → 平台选美团 → 选日期 → 下载评论</div>
        <div class="files" id="filesMeituan"></div>
      </div>
      <div class="lane">
        <span class="tag">抖音来客</span>
        <div class="drop" data-pf="douyin"
             title="导出路径：抖音来客 → 经营成长 → 评价管理 → 全部评价 → 导出（右上角）→ 导出评价">
          <div class="big">抖音评价表</div>
          <div class="small">可一次选多份</div>
        </div>
        <div class="path">导出路径：抖音来客 → 经营成长 → 评价管理 → 全部评价 → 导出（右上角）→ 导出评价</div>
        <div class="files" id="filesDouyin"></div>

    </div>
    <input type="file" id="fileInput" multiple accept=".xlsx,.xls" />
    <div class="filemeta" id="fileMeta"></div>
    <!-- 数据缺口/重复的提醒：说的是上传的数据本身，所以挨着文件列表放，
         不占结果区的头条位置 -->

    <div class="err" id="err"></div>
  </section>

  </div>

  <div class="pane pane-b">
  <!-- ② 口径 -->
  <section class="card">
    <div class="opts">
      <div>
        <label class="fl" for="threshold">好评口径</label>

          <option value="4" selected>4星及以上算好评</option>

      <div class="wide">

      <div>
        <label class="fl" for="mgrFilter">区域经理</label>
        <div class="row">
          <select id="mgrFilter"><option value="">全部门店</option></select>
          <button class="btn ghost mini" id="mgrEditBtn" type="button">管理</button>
        </div>
      </div>
      <div>
        <label class="fl" for="dedup">完全重复的记录</label>
        <select id="dedup">
          <option value="0" selected>保留（后台原始口径）</option>
          <option value="1">合并去重</option>

    <div class="actions">
      <button class="btn" id="runBtn" disabled>开 始 统 计</button>

  </section>

  </div>

  <div class="pane pane-r">
  <!-- ③ 结果 -->
  <section class="card hidden" id="resultCard">
    <!-- 这一块冻结在栏顶，下面的报表在它底下滚 -->
    <div class="res-head">
      <div class="res-top">
        <h2>统计结果<span class="lead" id="resultLead"></span></h2>
        <div class="res-acts">
          <button class="btn ghost hidden" id="exportBtn">导出 Excel</button>
          <button class="btn ghost hidden" id="imgBtn">下载图片</button>
        </div>
      </div>
      <div class="tabs">
        <div class="tab on" data-tab="sum">门店好评差评</div>
        <div class="tab" data-tab="map">门店名称对照</div>
      </div>

    <div class="kpis" id="kpis"></div>
    <!-- 页面上显示的就是导出的那张图本身。下面三块留在 DOM 里只当数据源，不显示。 -->
    <div id="preview"></div>
    <div class="tablewrap"><div id="tableHost"></div></div>
    <div class="coverage" id="coverage"></div>

  <div class="footnote">Crafted for Excellence</div>
</main>

<!-- 区域经理分组 -->
<div class="mask hidden" id="mgrMask">
  <div class="modal">
    <h3>区域经理分组</h3>
    <p class="lead">先选一位经理，再勾选他负责的门店；保存后可在「区域经理」下拉里按人筛选。</p>
    <div class="mgr-chips" id="mgrChips"></div>

      <button class="btn ghost mini" id="storeAll" type="button">全选</button>

<div id="toast" role="status" aria-live="polite"></div>

<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/exceljs.min.js"></script>
<script>
/* ═══════════ 工具 ═══════════ */
var $=function(s){return document.querySelector(s)};
var SEP=String.fromCharCode(1);
var toastTimer=null;
function toast(text,type){
  var el=$('#toast'); el.textContent=text;
  /* 绿/红那套配色不属于这张骨白纸：提示一律墨色，只有出错用品牌粉 */
  el.style.background=type==='error'?'#A56B79':'#16140F';
  el.style.display='block';
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.style.display='none'},2400);
}
function pad(n){return String(n).padStart(2,'0')}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
/* ── 门店简称 ──────────────────────────────────────────────
   简称取括号里的内容，用来打通两个平台不一样的门店全称。

   RENAME 是改名表：左边写后台数据里括号中的原名，右边写你要显示的名字。
   两个平台原名不一致时，都写进来映射到同一个名字就会自动合并。
   带副品牌后缀的那种也能改，键按原名写即可（'周巷店·珀莱雅' → '周巷珀莱雅'）。 */
var RENAME={
  '邱隘店':'邱隘倾城店',
  '邱隘二店':'邱隘思美店',
  '小港店':'美时百货',
  '炼化店':'华悦美妆',
  '泗门东大街店':'泗门赫眉',
  '奉化溪口店':'溪口店',
  '海曙联丰路店':'联丰店',
  '洪塘海德广场店':'洪塘店',
  '周巷店·珀莱雅':'周巷珀莱雅',
  /* 珀莱雅那家在两个平台上挂的地址不一样（余姚泗门 / 泗门东大街），其实是同一家，
     两条都映射到同一个名字就自动并成一家 */
  '泗门东大街店·珀莱雅':'泗门珀莱雅',
  '余姚泗门店·珀莱雅':'泗门珀莱雅'
};
/* 联名/副品牌：同一个地址可能开了两家（赫眉 和 赫眉·珀莱雅），
   括号里的字一模一样，光看括号会被并成一家，所以要把副品牌带进简称。
   但只有联名那一家的地址（古林、崇寿、低塘…），后缀纯属噪音 ——
   所以后缀只在"同址确实有两家"时才保留，见下面的 rebuildKeyFix。 */
var SUBBRANDS=['珀莱雅'];
var KEY_BASE={};          // 简称 → 去掉副品牌后缀的名字（判断同址是否两家用它）
var KEY_AUTO={};          // 后缀是自动加的才允许自动摘；改名表里写死的名字不许动

function shortName(name){
  var s=String(name||''), m=s.match(/[（(]([^（()）]+)[)）]/);
  var raw=m?m[1]:s.trim(), head=m?s.slice(0,m.index):s;
  var base=RENAME[raw]||raw;
  var sub='';
  for(var i=0;i<SUBBRANDS.length;i++){
    if(head.indexOf(SUBBRANDS[i])>=0){ sub=SUBBRANDS[i]; break }
  }
  var key=sub?(base+'·'+sub):base;
  /* 整条简称也能改名：改名表的键写原名或改后的名字都认 */
  var renamed=RENAME[sub?(raw+'·'+sub):raw]||RENAME[key];
  if(renamed) key=renamed;
  KEY_BASE[key]=base;
  KEY_AUTO[key]=!renamed&&!!sub;
  return key;
}
/* 扫一遍全部数据：某个地址只有一家店的，把副品牌后缀摘掉 */
var KEY_FIX={};
function rebuildKeyFix(){
  var byBase={};
  Object.keys(FILES).forEach(function(n){
    FILES[n].rows.forEach(function(r){
      var b=KEY_BASE[r.key]||r.key;
      (byBase[b]=byBase[b]||{})[r.key]=1;
    });
  });
  KEY_FIX={};
  Object.keys(byBase).forEach(function(b){
    var ks=Object.keys(byBase[b]);
    /* 同址只有一家、且后缀是自动加的，才把后缀摘掉。
       改名表里写死的名字（周巷珀莱雅、泗门珀莱雅）不能碰，否则会被改回地址名。 */
    if(ks.length===1 && ks[0]!==b && KEY_AUTO[ks[0]]) KEY_FIX[ks[0]]=b;
  });
}
function keyOf(r){ return KEY_FIX[r.key]||r.key }
function toStar(v){
  var m=String(v==null?'':v).match(/([\d.]+)/);
  return m?parseFloat(m[1]):null;
}
function toDay(v){
  if(v instanceof Date && !isNaN(v)) return v.getFullYear()+'-'+pad(v.getMonth()+1)+'-'+pad(v.getDate());
  var m=String(v==null?'':v).match(/(\d{4})[-\/年.](\d{1,2})[-\/月.](\d{1,2})/);
  return m?(m[1]+'-'+pad(m[2])+'-'+pad(m[3])):'';
}
function cjkWidth(s){
  s=String(s==null?'':s); var w=0;
  for(var i=0;i<s.length;i++) w += s.charCodeAt(i)>255 ? 2 : 1;
  return w;
}
function num(n){return Number(n).toLocaleString('zh-CN')}
/* 整行内容的短签名（FNV-1a），只用来数完全重复的记录，比存整行省几十倍空间 */
function hash(str){
  var h=2166136261;
  for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=(h*16777619)>>>0 }
  return h.toString(36)+'-'+str.length.toString(36);
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* ═══════════ 文件解析 ═══════════ */
var FILES={};      // 文件名 -> {name, platform, rows}
var RESULT=null;

var PLATFORMS={
  meituan:{label:'美团', short:'mt', date:'评价时间', store:'评价门店', star:'星级'},
  douyin :{label:'抖音', short:'dy', date:'评价时间', store:'门店名称', star:'推荐等级'}
};
function detect(headers){
  var h=headers.map(function(x){return String(x==null?'':x).trim()});
  if(h.indexOf('推荐等级')>=0 && h.indexOf('门店名称')>=0) return 'douyin';
  if(h.indexOf('星级')>=0 && h.indexOf('评价门店')>=0) return 'meituan';
  return null;
}
/* lane = 用户把文件丢进了哪条通道，用来校验别传串了 */
function readFile(file,lane){
  return new Promise(function(resolve,reject){
    var fr=new FileReader();
    fr.onerror=function(){reject(new Error('读取失败'))};
    fr.onload=function(e){
      try{
        var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        var ws=wb.Sheets[wb.SheetNames[0]];
        var aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
        if(!aoa.length) throw new Error('表格是空的');
        var headers=aoa[0], pf=detect(headers);
        if(!pf) throw new Error('表头认不出来，不像评价导出表');
        if(pf!==lane) throw new Error('这是'+PLATFORMS[pf].label+'的表，请传到'+PLATFORMS[pf].label+'那一栏');
        var cfg=PLATFORMS[pf];
        var iD=headers.indexOf(cfg.date), iS=headers.indexOf(cfg.store), iR=headers.indexOf(cfg.star);
        var rows=[];
        for(var i=1;i<aoa.length;i++){
          var r=aoa[i]; if(!r) continue;
          var day=toDay(r[iD]), store=String(r[iS]==null?'':r[iS]).trim();
          if(!day||!store) continue;
          rows.push({pf:pf, day:day, store:store, key:shortName(store), star:toStar(r[iR]), sig:hash(r.join(SEP))});
        }
        if(!rows.length) throw new Error('没有解析到有效数据行');
        resolve({name:file.name, platform:pf, rows:rows});
      }catch(err){ reject(err) }
    };
    fr.readAsArrayBuffer(file);
  });
}
function renderFiles(){
  ['meituan','douyin'].forEach(function(pf){
    var host=$('#files'+pf.charAt(0).toUpperCase()+pf.slice(1));
    host.innerHTML='';
    var mine=Object.keys(FILES).filter(function(n){ return FILES[n].platform===pf });
    mine.forEach(function(n){
      var f=FILES[n];
      var div=document.createElement('div'); div.className='chip';
      div.innerHTML='<b></b><span class="n">'+f.rows.length+' 条</span>'+
        '<span class="dl" title="下载这份数据（Excel）">⤓</span><span class="x" title="移除">×</span>';
      div.querySelector('b').textContent=n;
      div.querySelector('.dl').onclick=function(){ downloadRows(pf,[n], baseName(n)+'_明细.xlsx') };
      div.querySelector('.x').onclick=function(){delete FILES[n];saveFiles();renderFiles();refreshDateOptions()};
      host.appendChild(div);
    });
    if(mine.length>1){
      var all=document.createElement('button');
      all.type='button'; all.className='dlall';
      all.textContent='下载全部'+PLATFORMS[pf].label+'数据';
      all.onclick=function(){ downloadRows(pf,mine,PLATFORMS[pf].label+'评价明细.xlsx') };
      host.appendChild(all);
    }
  });
  var names=Object.keys(FILES), total=0, saved=null;
  names.forEach(function(n){ total+=FILES[n].rows.length; if(FILES[n].savedAt) saved=Math.max(saved||0,FILES[n].savedAt) });
  var meta=$('#fileMeta');
  if(names.length){
    meta.innerHTML='<span>共 <b>'+num(total)+'</b> 条评价</span>'+
      '<button class="linkbtn" id="clearSavedBtn">清空</button>';
    meta.querySelector('#clearSavedBtn').onclick=clearSaved;
  }else{
    meta.innerHTML='';
  }
  $('#runBtn').disabled = names.length===0;
}
/* ═══════════ 下载已上传的评价明细 ═══════════ */
function saveBlob(blob,name){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
}
function baseName(n){ return String(n).replace(/\.(xlsx|xls)$/i,'') }
function starLabel(star,th){
  if(star==null) return '星级不明';
  return star>=th ? '好评' : '差评';
}
/* 浏览器里只留了 日期/门店/星级/去重签名，评价正文没存，所以下载的是这四列的明细 */
async function downloadRows(pf,names,outName){
  var cfg=PLATFORMS[pf], th=parseFloat($('#threshold').value)||4, rows=[];
  names.forEach(function(n){ var f=FILES[n]; if(f&&f.platform===pf) rows=rows.concat(f.rows) });
  if(!rows.length){ toast('没有可下载的数据','error'); return }
  rows.sort(function(a,b){ return a.day<b.day?-1:(a.day>b.day?1:a.key.localeCompare(b.key,'zh')) });
  try{
    var wb=new ExcelJS.Workbook(); wb.creator='好评统计';
    var ws=wb.addWorksheet(cfg.label+'评价明细');
    ws.addRow([cfg.date,cfg.store,'门店简称',cfg.star,'评价类型']);
    rows.forEach(function(r){ ws.addRow([r.day,r.store,r.key,(r.star==null?'':r.star),starLabel(r.star,th)]) });
    styleSheet(ws,false);
    var buf=await wb.xlsx.writeBuffer();
    saveBlob(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),outName);
    toast('已下载 '+num(rows.length)+' 条'+cfg.label+'评价','success');
  }catch(e){ toast('下载失败：'+e.message,'error') }
}

async function addFiles(list,lane){
  $('#err').textContent='';
  var files=Array.prototype.slice.call(list||[]);   /* 一次可以选多份 */
  var errs=[], ok=0;
  for(var i=0;i<files.length;i++){
    try{ var r=await readFile(files[i],lane); r.savedAt=Date.now(); FILES[r.name]=r; ok++; }
    catch(e){ errs.push(files[i].name+'：'+e.message) }
  }
  saveFiles(); renderFiles(); refreshDateOptions();
  if(errs.length){ $('#err').innerHTML=errs.map(esc).join('<br>'); toast('有 '+errs.length+' 个文件没读进来','error'); }
  else if(ok) toast('已载入 '+ok+' 个文件','success');
}

/* ═══════════ 本地保存（刷新后不用重新上传） ═══════════ */
var LS_FILES='reviewStats.files', LS_OPTS='reviewStats.opts';
/* 每行压成 日期|门店|星级|签名，整体比原始表小几十倍，够塞进 localStorage */
function packFile(f){
  return {n:f.name, p:f.platform, t:f.savedAt||Date.now(),
    r:f.rows.map(function(r){ return [r.day,r.store,(r.star==null?'':r.star),r.sig].join(SEP) }).join('\n')};
}
function unpackFile(o){
  var rows=o.r?o.r.split('\n'):[];
  return {name:o.n, platform:o.p, savedAt:o.t, rows:rows.map(function(line){
    var a=line.split(SEP);
    return {pf:o.p, day:a[0], store:a[1], key:shortName(a[1]), star:(a[2]===''?null:parseFloat(a[2])), sig:a[3]};
  })};
}
function saveFiles(){
  try{
    var arr=Object.keys(FILES).map(function(n){ return packFile(FILES[n]) });
    localStorage.setItem(LS_FILES, JSON.stringify(arr));
  }catch(e){
    toast('数据太大，这次没能保存到本地','error');
  }
}
function saveOpts(){
  try{
    localStorage.setItem(LS_OPTS, JSON.stringify({
      th:$('#threshold').value, dedup:$('#dedup').value, dates:DATES, mgr:$('#mgrFilter').value
    }));
  }catch(e){}
}
function loadSaved(){

  if(opts){
    if(opts.th) $('#threshold').value=opts.th;
    if(opts.dedup) $('#dedup').value=opts.dedup;
    /* 日期区间不恢复上次的选择 —— 每次打开都回到"最近一周"，
       见 refreshDateOptions()。上次选的区间早就过期了，恢复它只会让人看错数。 */
  }
  loadMgrs(); renderMgrFilter();
  if(opts && opts.mgr && mgrById(opts.mgr)) $('#mgrFilter').value=opts.mgr;
  var arr=null;
  try{ arr=JSON.parse(localStorage.getItem(LS_FILES)||'null') }catch(e){}
  if(arr && arr.length){
    arr.forEach(function(o){ var f=unpackFile(o); if(f.rows.length) FILES[f.name]=f });
  }
  renderFiles(); refreshDateOptions();
}
function clearSaved(){
  FILES={}; RESULT=null;

/* ═══════════ 日期区间 ═══════════ */
/* DATES 始终是 [开始, 结束]（同一天就只有一个元素），升序。
   下游（累计口径、日期对比页签、新增好评数量）全都照旧按数组来，
   所以这里换掉的只是选择方式，统计逻辑一行没动。 */
var DATES=[];
var DATA_MIN='', DATA_MAX='';     // 数据里最早 / 最晚的一天

function refreshDateOptions(){
  var min='', max='';
  Object.keys(FILES).forEach(function(n){
    FILES[n].rows.forEach(function(r){
      if(!r.day) return;
      if(!min||r.day<min) min=r.day;
      if(!max||r.day>max) max=r.day;
    });
  });
  DATA_MIN=min; DATA_MAX=max;
  var f=$('#dateFrom'), t=$('#dateTo');
  [f,t].forEach(function(el){ el.min=min||''; el.max=max||'' });
  $('#dateHint').textContent = min
    ? ('数据覆盖 '+min+' ~ '+max)
    : '先上传表格，这里会带出数据覆盖的日期';
  /* 每次都回到"最近一周"（上面那句 if 去掉了条件判断）：
     截止到昨天（今天的数据还没出全），往前数 7 天。
     今天是 9/21 的话就是 9/14 ~ 9/20。数据不够长就往数据范围里收。 */
  if(min){
    var ymd=function(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()) };
    var e=new Date(); e.setDate(e.getDate()-1);
    var end=ymd(e); if(end>max) end=max;
    var b=new Date(end+'T00:00:00'); b.setDate(b.getDate()-6);
    var start=ymd(b); if(start<min) start=min;
    f.value=start; t.value=end;
  }
  syncRange(true);
}
function syncRange(silent){
  var f=$('#dateFrom'), t=$('#dateTo');
  if(!f.value||!t.value){ DATES=[]; return }
  if(f.value>t.value){          /* 反了就自动调过来，不报错 */
    var tmp=f.value; f.value=t.value; t.value=tmp;
  }
  DATES = f.value===t.value ? [f.value] : [f.value,t.value];
  if(!silent){
    saveOpts();
    /* 改区间要重算：每家店的"截至某日累计"是按选中日期算出来的，
       只重画不重算会拿旧日期的累计值。 */
    if(typeof RESULT!=='undefined' && RESULT && Object.keys(FILES).length){
      try{ RESULT=compute(); render() }
      catch(e){ $('#err').textContent='统计出错：'+e.message }
    }
  }
}
$('#dateFrom').onchange=function(){ syncRange() };
$('#dateTo').onchange=function(){ syncRange() };

$('#threshold').onchange=saveOpts;
$('#dedup').onchange=saveOpts;
syncRange(true);
loadSaved();          /* 打开页面就把上次的表格捞回来 */

/* ═══════════ 统计 ═══════════ */
function compute(){
  var th=parseFloat($('#threshold').value);
  var dates=DATES.slice().sort();
  /* 选了区间，所有数字就都是这个区间里的：区间外的评价不计入好评/差评。
     （"日期对比"页签要的是"截至某日累计"，那个仍然按全部数据算，见下面的 cum） */
  var from=dates[0]||'', to=dates[dates.length-1]||'';
  var inRange=function(day){ return !from || (day>=from && day<=to) };
  var nInRange=0;
  var dedup=$('#dedup').value==='1';
  var rows=[], seen={}, dupCount=0;
  Object.keys(FILES).forEach(function(n){
    FILES[n].rows.forEach(function(r){
      var sig=r.pf+SEP+r.sig;
      if(seen[sig]){ dupCount++; if(dedup) return; } else seen[sig]=1;
      rows.push(r);
    });
  });
  rebuildKeyFix();
  var S={}, alias={}, cover={};
  rows.forEach(function(r){
    var key=keyOf(r);
    if(!S[key]){
      var o={key:key,mt:[0,0,0],dy:[0,0,0],mtTotal:0,dyTotal:0};
      S[key]=o;
    }
    if(!alias[key]) alias[key]={};
    alias[key][r.store]=1;
    if(!cover[r.pf]) cover[r.pf]={min:r.day,max:r.day,n:0};
    var c=cover[r.pf]; c.n++; if(r.day<c.min)c.min=r.day; if(r.day>c.max)c.max=r.day;
    var s=S[key], p=(r.pf==='meituan'?'mt':'dy');
    /* 只分好评 / 差评两档：够星算好评，其余一律差评（原来 3 星单列中评，已去掉）。
       槽位 1 留给「星级读不出来」的行，两边都不算，免得凭空多出差评。 */
    var b = (r.star==null) ? 1 : (r.star>=th ? 0 : 2);   // 0好 1星级不明(不计入) 2差
    if(inRange(r.day)){ s[p][b]++; nInRange++ }
    /* 好评总数：不看日期区间，传进来的全部都算（覆盖哪几天，日期卡片上写着） */
    if(b===0) s[p+'Total']++;
  });
  var list=Object.keys(S).map(function(k){
    var s=S[k];
    s.good=s.mt[0]+s.dy[0]; s.bad=s.mt[2]+s.dy[2];
    s.unknown=s.mt[1]+s.dy[1];   /* 星级读不出来的条数，只用来对总数，不展示 */
    s.mtAll=s.mt[0]+s.mt[1]+s.mt[2]; s.dyAll=s.dy[0]+s.dy[1]+s.dy[2];
    s.all=s.mtAll+s.dyAll;
    s.rate=s.all?s.good/s.all*100:0;
    s.names=Object.keys(alias[k]).sort().join(' / ');
    return s;
  });
  return {list:list, cover:cover, dupCount:dupCount, dates:dates, th:th,
          total:nInRange, gaps:findGaps(rows,cover), all:{from:DATA_MIN,to:DATA_MAX}};
}
/* 数据空档：某个平台在自己的覆盖区间里，连续 GAP_DAYS 天一条评价都没有。
   正常经营不可能整周零评价，基本就是那一段的导出表漏传了 —— 所以要提醒。 */
var GAP_DAYS=7;
function findGaps(rows,cover){
  var out=[];
  Object.keys(PLATFORMS).forEach(function(pf){
    var c=cover[pf]; if(!c) return;
    var have={};
    rows.forEach(function(r){ if(r.pf===pf) have[r.day]=1 });
    var d=new Date(c.min+'T00:00:00'), end=new Date(c.max+'T00:00:00');
    var run=0, from='', last='';
    var flush=function(){
      if(run>=GAP_DAYS) out.push({pf:pf, from:from, to:last, days:run});
      run=0;
    };
    while(d<=end){
      var key=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
      if(have[key]) flush();
      else { if(!run) from=key; last=key; run++ }
      d.setDate(d.getDate()+1);
    }
    flush();
  });
  return out.sort(function(a,b){ return b.days-a.days });
}
/* 数据空档：某个平台在自己的覆盖区间里，连续 GAP_DAYS 天一条评价都没有。
   正常经营不可能整周零评价，基本就是那一段的导出表漏传了 —— 所以要提醒。 */
var GAP_DAYS=7;
function findGaps(rows,cover){
  var out=[];
  Object.keys(PLATFORMS).forEach(function(pf){
    var c=cover[pf]; if(!c) return;
    var have={};
    rows.forEach(function(r){ if(r.pf===pf) have[r.day]=1 });
    var d=new Date(c.min+'T00:00:00'), end=new Date(c.max+'T00:00:00');
    var run=0, from='', last='';
    var flush=function(){
      if(run>=GAP_DAYS) out.push({pf:pf, from:from, to:last, days:run});
      run=0;
    };
    while(d<=end){
      var key=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
      if(have[key]) flush();
      else { if(!run) from=key; last=key; run++ }
      d.setDate(d.getDate()+1);
    }
    flush();
  });
  return out.sort(function(a,b){ return b.days-a.days });
}
/* ═══════════ 渲染 ═══════════ */
var TAB='sum';
function render(){
  var R=RESULT, D=R.dates;
  var scope=scopeSet();
  var L = scope ? R.list.filter(function(s){ return scope[s.key] }) : R.list;
  R.view=L;   /* 导出用同一份范围 */
  var T={good:0,bad:0,mtAll:0,dyAll:0,all:0,mt0:0,mt1:0,mt2:0,dy0:0,dy1:0,dy2:0};
  L.forEach(function(s){
    T.good+=s.good;T.bad+=s.bad;T.mtAll+=s.mtAll;T.dyAll+=s.dyAll;T.all+=s.all;
    T.mt0+=s.mt[0];T.mt1+=s.mt[1];T.mt2+=s.mt[2];T.dy0+=s.dy[0];T.dy1+=s.dy[1];T.dy2+=s.dy[2];
  });
  R.T=T;

  renderWarn(R);
  var m=mgrById($('#mgrFilter').value);
  var scopeTxt=m?('区域经理：'+m.name+' · '):'';
  var cntTxt=scope?('共 '+L.length+' 家门店（全部 '+R.list.length+' 家）'):('共 '+L.length+' 家门店，区间内 '+num(R.total)+' 条评价');
  $('#resultLead').textContent=scopeTxt+cntTxt+
    (R.dupCount&&!scope?('（其中 '+R.dupCount+' 条为完全重复记录）'):'');
  if(scope && !L.length){
    $('#kpis').innerHTML=''; $('#tableHost').innerHTML='<div class="msel-empty">这位经理名下的门店，在已上传的数据里一条评价都没有</div>';
    $('#coverage').innerHTML=''; $('#resultCard').classList.remove('hidden');
    $('#exportBtn').classList.remove('hidden'); $('#imgBtn').classList.remove('hidden');
    if(window.renderPreview) renderPreview();
    return;
  }

  var first=D[0], last=D[D.length-1];
  /* 页面上这排 = 导出图上那排，三个，顺序也一样：
     日期区间 → 新增好评数量（中间，大、品牌粉）→ 差评总数。
     没选出区间时中间退回好评总数，免得中间空着。 */
  var md=function(d){ return d?d.slice(5).replace('-','/'):'' };   /* 09-21 → 09/21 */
  var cards=[];
  /* 两段日期都写出来：大字 = 新增/差评的区间（默认最近一周），小字 = 好评总数的近 1 年 */
  var sl=function(d){ return d?d.slice(2).replace(/-/g,'/'):'' };   /* 2025-09-28 → 25/09/28 */
  var nd=D.length>1?dayGap(first,last)+1:1;
  cards.push(kpi('新增 · '+nd+'天',
    D.length>1?(md(first)+'-'+md(last)):md(first),
    R.all.from?('好评总数 · 累计\n'+sl(R.all.from)+'-'+sl(R.all.to)):'', false,true));
  cards.push(kpi('新增好评数量','+'+num(T.good),
    D.length>1?('共 '+(dayGap(first,last)+1)+' 天'):'当天', false,false,true));
  cards.push(kpi('差评总数',num(T.bad),'美团 '+num(T.mt2)+' · 抖音 '+num(T.dy2)));
  $('#kpis').innerHTML=cards.join('');

  $('#resultCard').classList.toggle('shot',TAB==='sum');   /* 只有主表走图片预览 */
  if(TAB==='sum') renderSum(L,T);
  else renderMap(L);

  var cv=[];
  ['meituan','douyin'].forEach(function(p){
    if(R.cover[p]) cv.push('<b>'+PLATFORMS[p].label+'</b> 数据覆盖 '+R.cover[p].min+' ~ '+R.cover[p].max+'，共 '+num(R.cover[p].n)+' 条');
  });
  cv.push('好评：'+R.th+' 星及以上　差评：其余');
  $('#coverage').innerHTML=cv.join('<br>');
  $('#resultCard').classList.remove('hidden');
  $('#exportBtn').classList.remove('hidden');
  $('#imgBtn').classList.remove('hidden');
  if(window.renderPreview) renderPreview();   /* 页面显示的就是导出图本身 */
}
/* 数据有明显缺口或重复就顶出来说，别让人拿着半份数据下结论 */
function renderWarn(R){
  var w=[];
  (R.gaps||[]).forEach(function(g){
    w.push('<b>'+PLATFORMS[g.pf].label+'</b> '+g.from+' ~ '+g.to+
           ' 连续 '+g.days+' 天没有评价，这段的导出表可能漏传了');
  });
  if(R.dupCount){
    w.push('<b>'+num(R.dupCount)+'</b> 条完全重复的记录'+
           ($('#dedup').value==='1' ? '，已去重' : '，当前全部计入；同一份表传了两次就改成「合并去重」'));
  }
  var el=$('#warn');
  el.innerHTML=w.map(function(t){ return '<div>'+t+'</div>' }).join('');
  el.classList.toggle('hidden',!w.length);
}
function kpi(k,v,s,up,sm,hero){
  return '<div class="kpi'+(hero?' hero':'')+'"><div class="k">'+k+'</div><div class="v'+
         (up?' up':'')+(sm?' sm':'')+'">'+v+'</div><div class="s">'+s+'</div></div>';
}
function dayGap(a,b){
  if(!a||!b) return '-';
  return Math.round((new Date(b)-new Date(a))/86400000);
}
function table(head,body,totalRow){
  return '<table><thead><tr>'+head.map(function(x){return '<th>'+x+'</th>'}).join('')+
         '</tr></thead><tbody>'+body+(totalRow||'')+'</tbody></table>';
}
/* 差评合成一列：只写有数的那边，两边都是 0 就一个 0，
   免得每行都挂着"美团差评0个/抖音差评0个"这种废话。
   class 里的 r 是给导出图看的 —— 告诉它这列虽然是文字也要右对齐。 */
function badCell(mt,dy){
  if(!mt&&!dy) return '<td class="zero r">0</td>';
  var p=[];
  if(mt) p.push('美团'+mt+'个');
  if(dy) p.push('抖音'+dy+'个');
  return '<td class="bad r mix">'+p.join('/')+'</td>';
}
function cell(v,cls){
  return '<td class="'+(v===0?'zero':(cls||''))+'">'+v+'</td>';
}
function delta(v){
  return v>0 ? '<td class="up">+'+v+'</td>' : '<td class="zero">0</td>';
}
/* 排名分 = 好评数 − 差评数 × BAD_WEIGHT。
   一条差评抵掉 10 条好评：有差评的店会明显往下掉，但不是一有差评就垫底，
   好评足够多还是能排在前面。觉得罚得太轻/太重，改这个数就行。 */
var BAD_WEIGHT=10;
function rankScore(s){ return s.good - s.bad*BAD_WEIGHT }
function renderSum(L,T){
  var hasMgr=MANAGERS.length>0;
  var body=L.slice().sort(function(a,b){
    return (rankScore(b)-rankScore(a)) || (b.good-a.good);
  }).map(function(s,i){
    return '<tr><td><span class="no">'+('0'+(i+1)).slice(-2)+'</span> '+s.key+'</td>'+
      cell(s.mt[0])+cell(s.mtTotal)+
      cell(s.dy[0])+cell(s.dyTotal)+badCell(s.mt[2],s.dy[2])+
      (hasMgr?('<td class="r mgr">'+(esc(mgrOf(s.key))||'<span class="zero">—</span>')+'</td>'):'')+
      '</tr>';
  }).join('');
  /* 按平台分组：每个平台「区间内新增」紧挨着「累计总数」，一眼对得上。
     差评合成一列写清楚是哪边的，区域经理放最后 */
  var head=['门店'].concat(
    ['美团新增','美团好评总数','抖音新增','抖音好评总数','差评'], hasMgr?['区域经理']:[]);
  $('#tableHost').innerHTML=table(head,body,'');
}
function renderMap(L){
  var body=L.slice().sort(function(a,b){return a.key.localeCompare(b.key,'zh')}).map(function(s){
    return '<tr><td>'+s.key+'</td><td style="text-align:left">'+esc(s.names)+'</td></tr>';
  }).join('');
  $('#tableHost').innerHTML=table(['门店简称','两平台出现过的全称'],body,'');
}
document.querySelectorAll('.tab').forEach(function(t){
  t.onclick=function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});
    t.classList.add('on'); TAB=t.dataset.tab;
    if(RESULT) render();
  };
});
$('#runBtn').onclick=function(){
  if(!Object.keys(FILES).length) return;
  if(!DATES.length){ toast('至少选一个日期','error'); return }
  try{
    RESULT=compute(); render();
    /* 不能用 scrollIntoView —— 它会把整个文档顶上去（overflow:hidden 也拦不住），
       页眉 logo 就被切掉了。只把结果栏自己滚回顶部即可。 */
    var pr=$('.pane-r'); if(pr) pr.scrollTop=0;
    window.scrollTo(0,0);
    toast('统计完成','success');
  }catch(e){ $('#err').textContent='统计出错：'+e.message; toast('统计出错','error') }
};

/* ═══════════ 导出 Excel（淡灰表头 / 冻结 / 筛选 / 不换行 / 无边框） ═══════════ */
function styleSheet(ws,hasTotal){
  var maxC=ws.columnCount, maxR=ws.rowCount;
  ws.getRow(1).eachCell(function(c){
    c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEFEFEF'}};
    c.font={bold:true,color:{argb:'FF333333'},size:11};
    c.alignment={horizontal:'center',vertical:'middle',wrapText:false};
  });
  for(var r=2;r<=maxR;r++){
    ws.getRow(r).eachCell(function(c){
      c.alignment={horizontal:(c.col===1?'left':'center'),vertical:'middle',wrapText:false};
    });
  }
  if(hasTotal){
    ws.getRow(maxR).eachCell(function(c){
      c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF7F7F7'}};
      c.font={bold:true,color:{argb:'FF333333'}};
    });
  }
  ws.eachRow(function(row){ row.height=20 });
  /* 注意：没显式定义过列时 ws.columns 是 null，只能用 getColumn 逐列取 */
  for(var i=1;i<=maxC;i++){
    var col=ws.getColumn(i), w=10;
    col.eachCell({includeEmpty:false},function(c){ w=Math.max(w,cjkWidth(c.value)+3) });
    col.width=Math.min(w,60);
  }
  ws.views=[{state:'frozen',xSplit:1,ySplit:1}];
  ws.autoFilter={from:{row:1,column:1},to:{row:(hasTotal?maxR-1:maxR),column:maxC}};
}
$('#exportBtn').onclick=async function(){
  if(!RESULT) return;
  var R=RESULT, T=R.T, L=R.view||R.list, D=R.dates;
  var wb=new ExcelJS.Workbook();
  wb.creator='好评统计';

  var hasMgr=MANAGERS.length>0;
  /* 这一页和网页上那张表 / 导出的图完全一致：同样的列、同样的排序、同样的口径。
     差评那格也照图上的写法（只写有数的那边），不另外拆成两列。 */
  var s1=wb.addWorksheet('门店好评差评统计');
  s1.addRow(['序号','门店','美团新增','美团好评总数','抖音新增','抖音好评总数','差评']
    .concat(hasMgr?['区域经理']:[]));
  L.slice().sort(function(a,b){
    return (rankScore(b)-rankScore(a)) || (b.good-a.good);
  }).forEach(function(s,i){
    var p=[];
    if(s.mt[2]) p.push('美团'+s.mt[2]+'个');
    if(s.dy[2]) p.push('抖音'+s.dy[2]+'个');
    s1.addRow([i+1,s.key,s.mt[0],s.mtTotal,s.dy[0],s.dyTotal,p.join('/')||0]
      .concat(hasMgr?[mgrOf(s.key)||'']:[]));
  });
  styleSheet(s1,true);

  if(MANAGERS.length){
    var sm=wb.addWorksheet('区域经理汇总');
    sm.addRow(['区域经理','门店数','美团新增','抖音新增','新增合计','差评']);
    /* 这一页按全部门店算，便于几位经理横向比较，不受上面的经理筛选影响 */
    var rows=[];
    MANAGERS.forEach(function(m){
      var mine=R.list.filter(function(s){ return m.stores.indexOf(s.key)>=0 });
      var g=0,b=0,mt=0,dy=0,all=0;
      mine.forEach(function(s){ g+=s.good;b+=s.bad;mt+=s.mt[0];dy+=s.dy[0];all+=s.all });
      rows.push({row:[m.name,mine.length,mt,dy,g,b], good:g});
    });
    /* 没有归属任何经理的门店单列一行 */
    var rest=R.list.filter(function(s){ return !mgrOf(s.key) });
    if(rest.length){
      var g=0,b=0,mt=0,dy=0,all=0;
      rest.forEach(function(s){ g+=s.good;b+=s.bad;mt+=s.mt[0];dy+=s.dy[0];all+=s.all });
      rows.push({row:['（未分配）',rest.length,mt,dy,g,b], good:-1});
    }
    rows.sort(function(a,b){ return b.good-a.good });
    rows.forEach(function(x){ sm.addRow(x.row) });
    styleSheet(sm,false);
  }

  var s4=wb.addWorksheet('门店名称对照');
  s4.addRow(['门店简称','两平台出现过的全称']);
  L.slice().sort(function(a,b){return a.key.localeCompare(b.key,'zh')}).forEach(function(s){ s4.addRow([s.key,s.names]) });
  styleSheet(s4,false);

  var buf=await wb.xlsx.writeBuffer();
  var blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  var mgrNow=mgrById($('#mgrFilter').value);
  saveBlob(blob,'好评统计'+(mgrNow?('_'+mgrNow.name):'')+'.xlsx');
  toast('已导出 Excel','success');
};
</script>

<script>
$('#imgBtn').onclick=function(){ exportImage() };

/* 预览点一下放大 */
(function(){
  var box=null;
  function close(){ if(box){ box.remove(); box=null } }
  document.addEventListener('click',function(e){
    if(box){ close(); return }
    var img=e.target.closest && e.target.closest('#preview img');
    if(!img) return;
    box=document.createElement('div');
    box.className='zoom';
    var big=new Image(); big.src=img.src; big.alt='导出图预览';
    box.appendChild(big);
    document.body.appendChild(box);
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') close() });
})();

/* 页眉 logo 上色：拿 PNG 的透明通道当遮罩，用 canvas 填品牌粉。
   和导出图里 tint() 是同一套做法，两处颜色因此始终一致。
   之前用的是 CSS mask，在部分环境里整块渲染不出来 —— logo 会凭空消失。 */
(function(){
  var el=$('.brand-logo');
  if(!el||!window.HYMN_LOGO) return;
  var img=new Image();
  img.onload=function(){
    var c=document.createElement('canvas');
    c.width=img.naturalWidth; c.height=img.naturalHeight;
    var x=c.getContext('2d');
    x.drawImage(img,0,0);
    x.globalCompositeOperation='source-in';
    x.fillStyle=(getComputedStyle(document.documentElement)
      .getPropertyValue('--pink-deep')||'').trim()||'#A56B79';
    x.fillRect(0,0,c.width,c.height);
    el.style.background='url('+c.toDataURL('image/png')+') no-repeat center/contain';
  };
  img.src=window.HYMN_LOGO;
})();
</script>
